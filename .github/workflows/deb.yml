name: Build deb package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: "deb"
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper-compat meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler cargo rustc libglib2.0-dev gettext appstream desktop-file-utils pkg-config libgirepository1.0-dev

      - name: Build deb package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Copy deb to workspace
        run: |
          cp ../packet_*.deb .

      - name: Install and test deb package
        run: |
          sudo dpkg -i packet_*.deb
          packet --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packet-deb
          path: packet_*.deb

      - name: Fetch release notes from upstream
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          curl -s https://api.github.com/repos/nozwock/packet/releases/tags/${TAG} | jq -r '.body' > release_notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: packet_*.deb
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}